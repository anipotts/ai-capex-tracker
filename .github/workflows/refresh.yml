# weekly refresh: sec -> databricks (bronze/silver/gold + checks) -> google sheet -> tableau public.
# filings land quarterly, so weekly is plenty. a failed check stops the run before publishing.
name: refresh

on:
  schedule:
    - cron: "17 13 * * 1" # mondays 13:17 utc, off the top of the hour when runners are busy
  workflow_dispatch:

permissions:
  contents: write # pushes the gold snapshot to the data branch
  id-token: write # lets google trust this workflow's oidc token, so no google key exists anywhere

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }} # an id, not a credential
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: pull sec filings
        run: uv run ingest/pull_sec.py

      - name: build lakehouse on databricks and run checks
        run: uv run run_databricks.py

      # workload identity federation: only workflows in anipotts/ai-capex-tracker can use this
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/779608775039/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: capex-sheet-writer@ai-capex-tracker-ap.iam.gserviceaccount.com

      - name: publish gold to google sheet
        run: uv run publish/google_sheet.py

      # main is protected (prs only), so snapshots land on their own `data` branch. a push
      # there still counts as repo activity, which keeps github from disabling the schedule.
      - name: commit gold snapshot to the data branch if it changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin data:data; then
            git worktree add "$RUNNER_TEMP/snap" data
          else
            git worktree add --orphan -b data "$RUNNER_TEMP/snap"
          fi
          cp data/gold/quarterly_capex.csv "$RUNNER_TEMP/snap/"
          cd "$RUNNER_TEMP/snap"
          git add quarterly_capex.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh gold snapshot"
            git push origin data
          fi
